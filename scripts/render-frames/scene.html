<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#05070c;overflow:hidden;} canvas{display:block;}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="tjsCanvas"></canvas>
<script type="module">
  import * as THREE from 'three';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  const params = new URLSearchParams(location.search);
  const W = parseInt(params.get('w') || '1440', 10);
  const H = parseInt(params.get('h') || '810', 10);

  const canvas = document.getElementById('tjsCanvas');

  // ---- road centerline: a flat, gently winding path (no tube/tunnel) ----
  const TOTAL_LENGTH = 26 * 130;
  const ROAD_W = 13;
  function roadPoint(u, out) {
    const z = u * TOTAL_LENGTH;
    const x = 22 * Math.sin(z * 0.010) + 9 * Math.sin(z * 0.026 + 1.1);
    out.set(x, 0, -z);
    return out;
  }
  function roadTangent(u) {
    const eps = 0.0015;
    const a = roadPoint(Math.max(0, u - eps), new THREE.Vector3());
    const b = roadPoint(Math.min(1, u + eps), new THREE.Vector3());
    return b.clone().sub(a).normalize();
  }
  function roadRight(u) {
    const fwd = roadTangent(u);
    return new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
  }
  // the truck runs ahead of the camera along the road; LEAD tapers to ~0 around
  // the "Stop" stage so the truck appears to slow and let the camera catch up
  // to it at the dock, then pulls away again.
  function leadFor(u) {
    // world-space distance from camera to the truck's pivot (near its cab),
    // converted to a u-delta — NOT a raw fraction of u (that puts it ~169
    // units out, past the fog). The trailer trails ~15 units behind the
    // pivot, so the clearance to its rear doors is this value minus ~15.
    const baseWorld = 38;
    const dwellWorld = Math.exp(-Math.pow((u - 0.58) / 0.05, 2)) * 16;
    const worldDist = Math.max(21, baseWorld - dwellWorld);
    return worldDist / TOTAL_LENGTH;
  }

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  renderer.localClippingEnabled = true;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070c);
  scene.fog = new THREE.FogExp2(0x05070c, 0.010);
  const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 500);

  const composer = new EffectComposer(renderer);
  composer.setSize(W, H);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), params.get('nobloom') ? 0 : 1.2, 0.55, 0.15);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  const COOL = new THREE.Color(0x38d6f0), WARM = new THREE.Color(0xf0be5a);
  const roadMat = new THREE.LineBasicMaterial({ color: COOL.clone(), transparent: true, opacity: 0.8 });
  const roadDimMat = new THREE.LineBasicMaterial({ color: COOL.clone(), transparent: true, opacity: 0.34 });
  const envMats = [roadMat, roadDimMat];

  // ---- road surface: edge rails + cross-ties + dashed centerline ----
  const roadGroup = new THREE.Group(); scene.add(roadGroup);
  const N_SEG = 420;
  {
    const left = [], right = [];
    for (let i = 0; i <= N_SEG; i++) {
      const u = i / N_SEG;
      const c = roadPoint(u, new THREE.Vector3());
      const r = roadRight(u);
      left.push(c.clone().add(r.clone().multiplyScalar(-ROAD_W / 2)));
      right.push(c.clone().add(r.clone().multiplyScalar(ROAD_W / 2)));
    }
    roadGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(left), roadMat));
    roadGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(right), roadMat));
    for (let i = 0; i <= N_SEG; i += 6) {
      roadGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([left[i], right[i]]), roadDimMat));
    }
    // dashed centerline
    for (let i = 0; i < N_SEG; i += 4) {
      const u0 = i / N_SEG, u1 = (i + 2) / N_SEG;
      const p0 = roadPoint(u0, new THREE.Vector3()), p1 = roadPoint(u1, new THREE.Vector3());
      roadGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p0, p1]), roadDimMat));
    }
  }

  // ---- ambient floating points for atmosphere/depth ----
  const N_PTS = 500;
  const ptPositions = new Float32Array(N_PTS * 3);
  for (let i = 0; i < N_PTS; i++) {
    const u = Math.random();
    const c = roadPoint(u, new THREE.Vector3());
    const r = roadRight(u);
    const side = (Math.random() - 0.5) * ROAD_W * 3.2;
    ptPositions[i * 3] = c.x + r.x * side;
    ptPositions[i * 3 + 1] = Math.random() * 14 - 1;
    ptPositions[i * 3 + 2] = c.z + r.z * side;
  }
  const ptGeo = new THREE.BufferGeometry();
  ptGeo.setAttribute('position', new THREE.BufferAttribute(ptPositions, 3));
  const ptMat = new THREE.PointsMaterial({ color: 0x9fe9f5, size: 0.5, transparent: true, opacity: 0.6, sizeAttenuation: true });
  scene.add(new THREE.Points(ptGeo, ptMat));

  // ---- wireframe buildings along the route (depot / warehouse / destination) ----
  function buildBox(w, h, d, mat) {
    const geo = new THREE.BoxGeometry(w, h, d);
    geo.translate(0, h / 2, 0);
    return new THREE.LineSegments(new THREE.EdgesGeometry(geo), mat);
  }
  function placeBuilding(u, side, w, h, d, opts) {
    opts = opts || {};
    const c = roadPoint(u, new THREE.Vector3());
    const r = roadRight(u);
    const fwd = roadTangent(u);
    const setback = ROAD_W / 2 + w * 0.5 + (opts.gap || 4);
    const pos = c.clone().add(r.clone().multiplyScalar(side * setback));
    const b = buildBox(w, h, d, roadMat);
    b.position.copy(pos);
    b.lookAt(pos.clone().add(fwd));
    roadGroup.add(b);
    const result = { mesh: b };
    if (opts.door) {
      const doorW = w * 0.32, doorH = h * 0.55;
      const door = buildBox(doorW, doorH, 0.2, roadDimMat);
      // door sits on the building's near (road-facing) wall — outward normal
      // points away from the building, back toward the road/open side.
      const doorNormal = r.clone().multiplyScalar(-side);
      const doorPos = pos.clone().add(r.clone().multiplyScalar(-side * (w / 2 + 0.11)));
      door.position.copy(doorPos);
      door.lookAt(doorPos.clone().add(fwd));
      roadGroup.add(door);
      result.doorPos = doorPos;
      result.doorNormal = doorNormal;
    }
    return result;
  }
  // origin depot — small, near the start (Dispatched)
  placeBuilding(0.03, -1, 16, 9, 20, {});
  // the big warehouse the truck pulls up to — matches the "Stop" dwell above
  const warehouse = placeBuilding(0.58, 1, 30, 15, 34, { door: true, gap: 3 });
  // a second, smaller structure near the end (Delivered/Trusted)
  placeBuilding(0.88, -1, 14, 8, 16, {});

  // ---- hero truck: a real CC0 low-poly box-truck model (Quaternius, via
  // poly.pizza), converted to wireframe edges so it matches the site's
  // glow style instead of being solid-shaded. ----
  const truckMat = new THREE.LineBasicMaterial({ color: 0xfff4e0, transparent: true, opacity: 0.3 });
  const truckDimMat = new THREE.LineBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.18 });

  const truck = new THREE.Group();
  scene.add(truck);
  const modelWrap = new THREE.Group();
  truck.add(modelWrap);

  const explodeParts = []; // { obj, dir(Vector3, local space) }
  const clipPlane = new THREE.Plane(new THREE.Vector3(1, 0, 0), 999); // moved into place once the model loads
  truckMat.clippingPlanes = [clipPlane];
  truckDimMat.clippingPlanes = [clipPlane];

  async function loadTruckModel() {
    const gltf = await new GLTFLoader().loadAsync('./models/delivery-truck.glb');
    const model = gltf.scene;

    // extract edges from every mesh, drop the shaded surfaces entirely
    const edgeGroup = new THREE.Group();
    model.updateMatrixWorld(true);
    model.traverse((o) => {
      if (!o.isMesh) return;
      const mat = /rim|glass|window/i.test(o.name) ? truckDimMat : truckMat;
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 45), mat);
      edges.matrix.copy(o.matrixWorld);
      edges.matrix.decompose(edges.position, edges.quaternion, edges.scale);
      edgeGroup.add(edges);
    });

    // re-center on the model's own footprint (bottom-center = local origin),
    // scale to our world units, and correct its authored facing to -Z.
    const box = new THREE.Box3().setFromObject(edgeGroup);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    edgeGroup.position.set(-center.x, -box.min.y, -center.z);
    const SCALE = 3.4 / size.x;
    modelWrap.scale.setScalar(SCALE);
    modelWrap.rotation.y = Math.PI; // model's authored front faces +Z; flip to -Z
    modelWrap.add(edgeGroup);

    // exploded-view directions: each part flies outward from the model's own
    // bounding-box center, along the vector from that center to the part's
    // own (pre-recentre) position — generic, needs no per-name hardcoding.
    edgeGroup.children.forEach((edges) => {
      edges.userData.basePos = edges.position.clone();
      const away = edges.position.clone().sub(center);
      edges.userData.explodeDir = away.lengthSq() > 0.0004 ? away.normalize() : new THREE.Vector3(0, 1, 0);
      explodeParts.push(edges);
    });

    window.__debugModel = { size: size.toArray(), scale: SCALE, edgeChildren: edgeGroup.children.length,
      vertCount: edgeGroup.children.reduce((s,c)=>s+c.geometry.attributes.position.count,0) };
    return size;
  }
  const truckReady = loadTruckModel();

  // ---- dock: where the truck backs in (the u=0.58 warehouse's real door) ----
  const DOCK_U = 0.58;
  const dockFwd = roadTangent(DOCK_U);
  // truck's parked spot: just outside the door, rear doors against it, nose
  // pointing back out along the door's outward normal — a genuine reverse-park.
  const DOCK_STANDOFF = 4.5; // truck half-length-ish clearance off the door plane
  const DOCK_POS = warehouse.doorPos.clone().add(warehouse.doorNormal.clone().multiplyScalar(DOCK_STANDOFF));
  const DOCK_FACE = warehouse.doorNormal.clone().normalize();
  // camera: pulled well back across the road for a wide 3/4 establishing
  // angle on the whole dock, not jammed up against the wall.
  const DOCK_CAM_POS = DOCK_POS.clone()
    .add(warehouse.doorNormal.clone().multiplyScalar(24))
    .add(dockFwd.clone().multiplyScalar(-14))
    .add(new THREE.Vector3(0, 8, 0));
  window.__debugDock = {
    DOCK_POS: DOCK_POS.toArray(), DOCK_CAM_POS: DOCK_CAM_POS.toArray(), DOCK_FACE: DOCK_FACE.toArray(),
    doorPos: warehouse.doorPos.toArray(), doorNormal: warehouse.doorNormal.toArray(),
  };

  // ---- phase windows along u (0..1), one continuous camera move throughout ----
  const DOCK_U0 = 0.40, DOCK_U1 = 0.60;   // peel off the road, back into the dock
  const CLIP_U0 = 0.72, CLIP_U1 = 0.87;   // clipping-plane cross-section sweep
  const EXPL_U0 = 0.87, EXPL_U1 = 1.00;   // explode into parts

  function smoothstep(a, b, x) {
    const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  const tmpCam = new THREE.Vector3(), tmpTruck = new THREE.Vector3(), tmpLook = new THREE.Vector3();
  window.renderFrame = function (u) {
    const dockT = smoothstep(DOCK_U0, DOCK_U1, u);

    // ---- truck position/facing: road-follow, blending into the dock spot ----
    const truckU = Math.min(1, u + leadFor(u));
    roadPoint(truckU, tmpTruck);
    const truckFwd = roadTangent(truckU);
    if (dockT > 0) tmpTruck.lerp(DOCK_POS, dockT);
    truck.position.copy(tmpTruck);
    const faceDir = dockT > 0 ? truckFwd.clone().lerp(DOCK_FACE, dockT).normalize() : truckFwd;
    truck.lookAt(tmpTruck.clone().add(faceDir));

    // ---- camera: chase cam, blending into a fixed dock observer angle ----
    const camR = roadRight(u);
    roadPoint(u, tmpCam);
    tmpCam.add(camR.clone().multiplyScalar(-4.2)).add(new THREE.Vector3(0, 5.4, 0));
    if (dockT > 0) tmpCam.lerp(DOCK_CAM_POS, dockT);

    // push in for the cross-section reveal (see the cutaway detail up close),
    // then pull back out once parts start exploding (give them room to read)
    const clipT = smoothstep(CLIP_U0, CLIP_U1, u);
    const explT = smoothstep(EXPL_U0, EXPL_U1, u);
    if (explT > 0) {
      const pushDir = tmpTruck.clone().sub(tmpCam).normalize();
      tmpCam.add(pushDir.multiplyScalar(10));
      const pullDir = pushDir.clone().negate();
      tmpCam.add(pullDir.multiplyScalar(explT * 4));
    } else if (clipT > 0) {
      const pushDir = tmpTruck.clone().sub(tmpCam).normalize();
      tmpCam.add(pushDir.multiplyScalar(clipT * 10));
    }
    camera.position.copy(tmpCam);
    tmpLook.copy(tmpTruck).add(new THREE.Vector3(0, 2.4, 0));
    camera.lookAt(tmpLook);

    // ---- cross-section: sweep a clipping plane across the truck's width,
    // cutting away the near-side wall to reveal the (now-open) interior ----
    const clipNormal = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), DOCK_FACE).normalize();
    clipPlane.normal.copy(clipNormal);
    const centerAlongNormal = clipNormal.dot(DOCK_POS);
    const OFFSET_START = 3.0;   // clipT=0: plane well clear of the truck, nothing clipped
    const OFFSET_END = -0.05;   // clipT=1: plane just past centerline, near half sliced away
    const offset = OFFSET_START + (OFFSET_END - OFFSET_START) * clipT;
    clipPlane.constant = -centerAlongNormal + offset;

    // ---- explode: parts fly apart from the model's own center ----
    const explodeDist = explT * 2.6;
    explodeParts.forEach((edges) => {
      if (!edges.userData.basePos) return;
      edges.position.copy(edges.userData.basePos)
        .add(edges.userData.explodeDir.clone().multiplyScalar(explodeDist / modelWrap.scale.x));
    });

    // ---- de-glow for the reveal: up close, the same bloom that reads as
    // "headlights" from a distance turns the truck into a white blob and
    // hides the cutaway/exploded detail — dial it back as we get close. ----
    const detailT = Math.max(clipT, explT);
    truckMat.opacity = 0.30 + (0.20 - 0.30) * detailT;
    truckDimMat.opacity = 0.18 + (0.11 - 0.18) * detailT;
    bloom.strength = 1.2 + (0.55 - 1.2) * detailT;

    const t = Math.min(1, u * 1.02);
    roadMat.color.copy(COOL).lerp(WARM, t);
    roadDimMat.color.copy(COOL).lerp(WARM, t);

    composer.render();
  };
  truckReady.then(() => { window.__sceneReady = true; }).catch((e) => { window.__sceneError = e.message || String(e); });
</script>
</body>
</html>
