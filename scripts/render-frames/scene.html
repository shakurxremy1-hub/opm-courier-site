<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#05070c;overflow:hidden;} canvas{display:block;}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="tjsCanvas"></canvas>
<script type="module">
  import * as THREE from 'three';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

  const params = new URLSearchParams(location.search);
  const W = parseInt(params.get('w') || '1440', 10);
  const H = parseInt(params.get('h') || '810', 10);

  const canvas = document.getElementById('tjsCanvas');

  // ---- road centerline: a flat, gently winding path (no tube/tunnel) ----
  const TOTAL_LENGTH = 26 * 130;
  const ROAD_W = 13;
  function roadPoint(u, out) {
    const z = u * TOTAL_LENGTH;
    const x = 22 * Math.sin(z * 0.010) + 9 * Math.sin(z * 0.026 + 1.1);
    out.set(x, 0, -z);
    return out;
  }
  function roadTangent(u) {
    const eps = 0.0015;
    const a = roadPoint(Math.max(0, u - eps), new THREE.Vector3());
    const b = roadPoint(Math.min(1, u + eps), new THREE.Vector3());
    return b.clone().sub(a).normalize();
  }
  function roadRight(u) {
    const fwd = roadTangent(u);
    return new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
  }
  // the truck runs ahead of the camera along the road; LEAD tapers to ~0 around
  // the "Stop" stage so the truck appears to slow and let the camera catch up
  // to it at the dock, then pulls away again.
  function leadFor(u) {
    // world-space distance from camera to the truck's pivot (near its cab),
    // converted to a u-delta — NOT a raw fraction of u (that puts it ~169
    // units out, past the fog). The trailer trails ~15 units behind the
    // pivot, so the clearance to its rear doors is this value minus ~15.
    const baseWorld = 38;
    const dwellWorld = Math.exp(-Math.pow((u - 0.58) / 0.05, 2)) * 16;
    const worldDist = Math.max(21, baseWorld - dwellWorld);
    return worldDist / TOTAL_LENGTH;
  }

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070c);
  scene.fog = new THREE.FogExp2(0x05070c, 0.010);
  const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 500);

  const composer = new EffectComposer(renderer);
  composer.setSize(W, H);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 1.2, 0.55, 0.15);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  const COOL = new THREE.Color(0x38d6f0), WARM = new THREE.Color(0xf0be5a);
  const roadMat = new THREE.LineBasicMaterial({ color: COOL.clone(), transparent: true, opacity: 0.8 });
  const roadDimMat = new THREE.LineBasicMaterial({ color: COOL.clone(), transparent: true, opacity: 0.34 });
  const envMats = [roadMat, roadDimMat];

  // ---- road surface: edge rails + cross-ties + dashed centerline ----
  const roadGroup = new THREE.Group(); scene.add(roadGroup);
  const N_SEG = 420;
  {
    const left = [], right = [];
    for (let i = 0; i <= N_SEG; i++) {
      const u = i / N_SEG;
      const c = roadPoint(u, new THREE.Vector3());
      const r = roadRight(u);
      left.push(c.clone().add(r.clone().multiplyScalar(-ROAD_W / 2)));
      right.push(c.clone().add(r.clone().multiplyScalar(ROAD_W / 2)));
    }
    roadGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(left), roadMat));
    roadGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(right), roadMat));
    for (let i = 0; i <= N_SEG; i += 6) {
      roadGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([left[i], right[i]]), roadDimMat));
    }
    // dashed centerline
    for (let i = 0; i < N_SEG; i += 4) {
      const u0 = i / N_SEG, u1 = (i + 2) / N_SEG;
      const p0 = roadPoint(u0, new THREE.Vector3()), p1 = roadPoint(u1, new THREE.Vector3());
      roadGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p0, p1]), roadDimMat));
    }
  }

  // ---- ambient floating points for atmosphere/depth ----
  const N_PTS = 500;
  const ptPositions = new Float32Array(N_PTS * 3);
  for (let i = 0; i < N_PTS; i++) {
    const u = Math.random();
    const c = roadPoint(u, new THREE.Vector3());
    const r = roadRight(u);
    const side = (Math.random() - 0.5) * ROAD_W * 3.2;
    ptPositions[i * 3] = c.x + r.x * side;
    ptPositions[i * 3 + 1] = Math.random() * 14 - 1;
    ptPositions[i * 3 + 2] = c.z + r.z * side;
  }
  const ptGeo = new THREE.BufferGeometry();
  ptGeo.setAttribute('position', new THREE.BufferAttribute(ptPositions, 3));
  const ptMat = new THREE.PointsMaterial({ color: 0x9fe9f5, size: 0.5, transparent: true, opacity: 0.6, sizeAttenuation: true });
  scene.add(new THREE.Points(ptGeo, ptMat));

  // ---- wireframe buildings along the route (depot / warehouse / destination) ----
  function buildBox(w, h, d, mat) {
    const geo = new THREE.BoxGeometry(w, h, d);
    geo.translate(0, h / 2, 0);
    return new THREE.LineSegments(new THREE.EdgesGeometry(geo), mat);
  }
  function placeBuilding(u, side, w, h, d, opts) {
    opts = opts || {};
    const c = roadPoint(u, new THREE.Vector3());
    const r = roadRight(u);
    const fwd = roadTangent(u);
    const setback = ROAD_W / 2 + w * 0.5 + (opts.gap || 4);
    const pos = c.clone().add(r.clone().multiplyScalar(side * setback));
    const b = buildBox(w, h, d, roadMat);
    b.position.copy(pos);
    b.lookAt(pos.clone().add(fwd));
    roadGroup.add(b);
    if (opts.door) {
      const doorW = w * 0.32, doorH = h * 0.55;
      const door = buildBox(doorW, doorH, 0.2, roadDimMat);
      const doorPos = pos.clone()
        .add(fwd.clone().multiplyScalar(0))
        .add(r.clone().multiplyScalar(-side * (w / 2 + 0.11)));
      door.position.copy(doorPos);
      door.lookAt(doorPos.clone().add(fwd));
      roadGroup.add(door);
    }
    return b;
  }
  // origin depot — small, near the start (Dispatched)
  placeBuilding(0.03, -1, 16, 9, 20, {});
  // the big warehouse the truck pulls up to — matches the "Stop" dwell above
  placeBuilding(0.58, 1, 30, 15, 34, { door: true, gap: 3 });
  // a second, smaller structure near the end (Delivered/Trusted)
  placeBuilding(0.88, -1, 14, 8, 16, {});

  // ---- hero truck: bright constant warm-white so it always reads as the
  // foreground subject, distinct from the road/building lerp colors ----
  const truckMat = new THREE.LineBasicMaterial({ color: 0xfff4e0, transparent: true, opacity: 0.97 });
  const truckDimMat = new THREE.LineBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.6 });
  // Local convention: the group faces -Z (its travel direction). The cab
  // leads at the most-negative z; the trailer trails behind it toward +Z,
  // which is the side a chase camera (positioned behind, at larger u) sees.
  // Chassis (frame-rail) height above ground — everything sits on top of
  // this, wheels hang below it, so the silhouette reads as "body on wheels"
  // instead of circles pasted mid-way up a box.
  const FRAME_Y = 2.0;
  function buildTruck() {
    const g = new THREE.Group();

    // sloped hood (a low front box + narrower nose) + tall cabin behind it —
    // a stepped conventional-semi silhouette, not a single plain box.
    const hood = new THREE.Mesh(new THREE.BoxGeometry(4.4, 2.2, 3.4));
    const hoodEdges = new THREE.LineSegments(new THREE.EdgesGeometry(hood.geometry), truckMat);
    hoodEdges.position.set(0, FRAME_Y + 1.1, -12.6);
    g.add(hoodEdges);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(4.9, 4.6, 3.0));
    const cabinEdges = new THREE.LineSegments(new THREE.EdgesGeometry(cabin.geometry), truckMat);
    cabinEdges.position.set(0, FRAME_Y + 2.3, -9.6);
    g.add(cabinEdges);

    // long box trailer, well behind the cab with a visible coupling gap
    const trailer = new THREE.BoxGeometry(6.2, 6.4, 18);
    const trailerEdges = new THREE.LineSegments(new THREE.EdgesGeometry(trailer), truckMat);
    trailerEdges.position.set(0, FRAME_Y + 3.2, 6);
    g.add(trailerEdges);
    // ridge lines along the trailer flank so it reads as a container, not a block
    [FRAME_Y + 1.6, FRAME_Y + 3.2, FRAME_Y + 4.8].forEach((yy) => {
      [-3.05, 3.05].forEach((xx) => {
        const pts = [new THREE.Vector3(xx, yy, -3), new THREE.Vector3(xx, yy, 15)];
        g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), truckDimMat));
      });
    });

    // frame rail connecting hood → cab → trailer along the chassis line
    [-2.35, 2.35].forEach((xx) => {
      const pts = [new THREE.Vector3(xx, FRAME_Y, -14.2), new THREE.Vector3(xx, FRAME_Y, 15)];
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), truckDimMat));
    });

    // raked windshield — the single detail that most reads as "vehicle front"
    // instead of "two stacked boxes": a diagonal line from the hood's top
    // rear edge up to the cabin's top front edge, each side.
    [-2.15, 2.15].forEach((xx) => {
      const pts = [
        new THREE.Vector3(xx, FRAME_Y + 2.2, -10.9),
        new THREE.Vector3(xx, FRAME_Y + 4.6, -11.1),
      ];
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), truckMat));
    });

    // grille lines on the hood's front face
    [2.4, 3.1, 3.8].forEach((yy) => {
      const pts = [new THREE.Vector3(-1.9, yy, -14.28), new THREE.Vector3(1.9, yy, -14.28)];
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), truckDimMat));
    });
    // front bumper, hanging below the frame ahead of the hood
    {
      const pts = [new THREE.Vector3(-2.5, FRAME_Y - 0.55, -14.3), new THREE.Vector3(2.5, FRAME_Y - 0.55, -14.3)];
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), truckMat));
    }

    // side mirrors on the cabin — small, but an instantly-recognizable tell
    [-2.65, 2.65].forEach((xx) => {
      const mirror = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.7, 0.9));
      const m = new THREE.LineSegments(new THREE.EdgesGeometry(mirror.geometry), truckDimMat);
      m.position.set(xx, FRAME_Y + 3.6, -10.4);
      g.add(m);
    });

    // dual exhaust stacks behind the cabin — classic conventional-semi silhouette
    [-2.2, 2.2].forEach((xx) => {
      const stackGeo = new THREE.CylinderGeometry(0.16, 0.16, 5.2, 8);
      const stack = new THREE.LineSegments(new THREE.EdgesGeometry(stackGeo), truckDimMat);
      stack.position.set(xx, FRAME_Y + 2.6, -8.0);
      g.add(stack);
    });

    // fuel tank along the frame, in the cab-to-trailer gap
    [-2.5, 2.5].forEach((xx) => {
      const tankGeo = new THREE.CylinderGeometry(0.85, 0.85, 3.4, 10);
      const tank = new THREE.LineSegments(new THREE.EdgesGeometry(tankGeo), truckDimMat);
      tank.rotation.x = Math.PI / 2;
      tank.position.set(xx, FRAME_Y - 0.3, -4.2);
      g.add(tank);
    });

    // wheels: small, hanging below the frame so they read as running gear —
    // steer axle under the hood, drive tandem under the cab/gap, trailer tandem at the rear
    const wheelGeo = new THREE.CylinderGeometry(0.95, 0.95, 0.55, 12);
    const axleZs = [-12.2, -8.4, -6.6, 10.5, 13];
    const axleTrack = [2.25, 2.55, 2.55, 2.85, 2.85];
    axleZs.forEach((z, i) => {
      const track = axleTrack[i];
      [-track, track].forEach((x) => {
        const w = new THREE.LineSegments(new THREE.EdgesGeometry(wheelGeo), truckDimMat);
        w.rotation.z = Math.PI / 2; w.position.set(x, FRAME_Y - 1.05, z);
        g.add(w);
      });
    });
    return g;
  }
  const truck = buildTruck();
  scene.add(truck);

  const tmpCam = new THREE.Vector3(), tmpTruck = new THREE.Vector3(), tmpLook = new THREE.Vector3();
  window.renderFrame = function (u) {
    const camR = roadRight(u);
    const camFwd = roadTangent(u);
    roadPoint(u, tmpCam);
    // camera: elevated, offset to one side, behind-and-above for a 3/4 chase angle
    tmpCam.add(camR.clone().multiplyScalar(-4.2)).add(new THREE.Vector3(0, 5.4, 0));
    camera.position.copy(tmpCam);

    const truckU = Math.min(1, u + leadFor(u));
    roadPoint(truckU, tmpTruck);
    const truckFwd = roadTangent(truckU);
    truck.position.copy(tmpTruck);
    truck.lookAt(tmpTruck.clone().add(truckFwd));

    tmpLook.copy(tmpTruck).add(new THREE.Vector3(0, 2.4, 0));
    camera.lookAt(tmpLook);

    const t = Math.min(1, u * 1.02);
    roadMat.color.copy(COOL).lerp(WARM, t);
    roadDimMat.color.copy(COOL).lerp(WARM, t);

    composer.render();
  };
  window.__sceneReady = true;
</script>
</body>
</html>
