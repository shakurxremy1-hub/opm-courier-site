<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#1a1a1a;} canvas{display:block;}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(1000, 700, false);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a1a);
  const camera = new THREE.PerspectiveCamera(45, 1000/700, 0.01, 1000);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dl = new THREE.DirectionalLight(0xffffff, 1.0); dl.position.set(5,10,7); scene.add(dl);
  scene.add(new THREE.AxesHelper(2));

  const loader = new GLTFLoader();
  window.__ready = false;
  loader.load('./models/delivery-truck.glb', (gltf) => {
    const model = gltf.scene;
    scene.add(model);
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    window.__info = { size: size.toArray(), center: center.toArray(), min: box.min.toArray(), max: box.max.toArray() };

    let meshCount = 0, triCount = 0;
    model.traverse(o => { if (o.isMesh) { meshCount++; const g = o.geometry; triCount += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
    window.__info.meshCount = meshCount;
    window.__info.triCount = triCount;

    const maxDim = Math.max(size.x, size.y, size.z);
    camera.position.set(center.x + maxDim*1.2, center.y + maxDim*0.9, center.z + maxDim*1.5);
    camera.lookAt(center);
    renderer.render(scene, camera);
    window.__ready = true;
  }, undefined, (err) => { window.__err = err.message || String(err); });

  window.__snap = function(pos, look) {
    camera.position.set(...pos);
    camera.lookAt(...look);
    renderer.render(scene, camera);
  };
</script>
</body>
</html>
